# This is an example of the main YAML file you write.
#
# This is essentially a copy of my YAML file to read a PG&E gas meter.  It
# is built for this hardware:
#
# M5Stack NanoC6: https://shop.m5stack.com/products/m5stack-nanoc6-dev-kit
# MMC5603 Magnetometer: https://www.adafruit.com/product/5579
#
# These two components can be connected together with the:
# Adafruit Grove to STEMMA QT Cable: https://www.adafruit.com/product/4528


# How this works:
#  - this links to other YAML files on GitHub.  Those files contain
#    more configuration and snippets of C++ code.
#  - anything in this file either adds-to or overwrites configuration in
#    the linked GitHub files.

# Anything here will override other substitutions in the linked files
substitutions:
  # Name your device.  Use only lowercase and hyphens, which in HA, will be
  # converted to underscores.  See: https://esphome.io/components/esphome/
  device_name: gas-meter

  # These are the GPIO pins of the M5Stack NanoC6
  i2c_scl: GPIO1
  i2c_sda: GPIO2
  gpio_led: GPIO7

  # Once you are convinced this is working, you may want to disable the
  # diagnostics in HA and save bandwidth / data.
  # enable_magnetic_field_strength_sensors: 'false'
  # enable_half_rotations_total_sensor: 'false'
  # enable_half_rotation_marker_sensor: 'false'


# This pulls in all the configuration and code from GitHub.
packages:
  meter: !include
    file: ./includes/gas-meter.yaml

# TODO: finish this section
# The default configuration works for an MMC5603 magnometer.  If you have a
# different magnometer, you will need to do this:


# Defines this device
esphome:
  name: ${device_name}
  comment: Measures the gas meter

# Defines the SoC.  This is the ESP32 in the M5Stack NanoC6
esp32:
  variant: esp32c6
  flash_size: 4MB
  cpu_frequency: 160MHZ

# You need an API section so HA can discover it
api:
  encryption:
    key: !secret api_encryption_key

# Over the Air updates
ota:
  - platform: esphome
    password: !secret ota_password

# Allows you to see logs from the device
logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails.
  # If your wifi is not available, the M5Stack NanoC6 will create a wifi access
  # point of its own and exposes a web UI that allows you to configure it to
  # a different wifi.
  ap:
    ssid: '${device_name}-fallback-ap'
    password: !secret ap_password

# Needed to expose web UI to change wifi settings
captive_portal:

sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
