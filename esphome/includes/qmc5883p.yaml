---

# Include this file to override settings for the mmc5603 sensor to instead
# support the qmc5883p magnetometer sensor

external_components:
  - source: github://mazzhead/esphome-components@main
    components: [qmc5883p]

logger:
  logs:
    qmc5883p: INFO

sensor:
  - id: !extend magnetometer_id
    platform: qmc5883p
    address: 0x2C
    oversampling: 1x
